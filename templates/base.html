<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PaintViz{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  {% block head %}{% endblock %}
</head>
<body>

<header>
  <div class="logo">Paint<span>Viz</span></div>
  <nav class="nav">
    <a href="/" class="nav-link {% if active_page == 'visualizer' %}active{% endif %}">Visualizer</a>
    <a href="/training" class="nav-link {% if active_page == 'training' %}active{% endif %}">Training</a>
  </nav>
</header>

{% block body %}{% endblock %}

{% block scripts %}{% endblock %}
</body>
</html>
